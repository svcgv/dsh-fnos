name: build-fpk

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
            fnpack: fnpack-1.3.3-linux-amd64
          - arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm
            fnpack: fnpack-1.3.3-linux-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify native runner
        shell: bash
        run: |
          actual="$(node -p 'process.arch')"
          test "$actual" = "${{ matrix.node_arch }}"
      - name: Install fnpack
        shell: bash
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/fnpack" "https://static2.fnnas.com/fnpack/${{ matrix.fnpack }}"
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Build and verify FPK
        run: node scripts/release.mjs --arch ${{ matrix.arch }}
      - name: Checksum
        run: sha256sum dist/dsh-fnos-*-linux-${{ matrix.arch }}.fpk
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-fnos-${{ matrix.arch }}
          path: dist/dsh-fnos-*-linux-${{ matrix.arch }}.fpk
          if-no-files-found: error
          retention-days: 14

  collect:
    name: verify-both-architectures
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-fnos-*
          path: dist
          merge-multiple: true
      - name: Verify downloaded amd64 artifact
        run: node scripts/verify-fpk.mjs --file dist/dsh-fnos-*-linux-amd64.fpk --arch amd64
      - name: Verify downloaded arm64 artifact
        run: node scripts/verify-fpk.mjs --file dist/dsh-fnos-*-linux-arm64.fpk --arch arm64

  release:
    name: create-release
    needs: collect
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-fnos-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for file in dsh-fnos-*-linux-*.fpk; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -lh
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-fnos-*-linux-*.fpk \
            dist/dsh-fnos-*-linux-*.fpk.sha256 \
            --verify-tag \
            --title "dsh-fnos ${GITHUB_REF_NAME#v}" \
            --generate-notes
