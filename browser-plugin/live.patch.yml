# network-browser-permission-reviewed-v1
# EXPERIMENTAL: visible browser panel in the normal workspace GUI.
# Never enable on a shared or untrusted profile: the panel drives a real headless
# Chromium and lets both the signed-in user and the Agent operate one page.
# Network mode accepts HTTP/HTTPS navigation to local, LAN, and public targets
# only after the signed-in user approves each model-requested URL in the panel.
- insert:
    - id: dsh-fnos-browser-live
      name: './live.mjs'
      disabled: !!js "process.env.DSH_FNOS_BROWSER_LIVE !== '1' || (process.env.DSH_FNOS_BROWSER_NETWORK !== '1' && process.env.DSH_FNOS_ACCEPTANCE_FIXTURE !== '1')"
