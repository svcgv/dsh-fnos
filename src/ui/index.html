<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">›_</span>
        <div>
          <h1>DeepSeek Harness</h1>
          <p class="subtitle">按项目隔离的智能体工作区</p>
        </div>
      </div>
      <div class="user" id="user" hidden></div>
    </header>

    <main>
      <section class="panel" aria-labelledby="new-title">
        <h2 id="new-title">新建项目</h2>
        <form id="create-form" autocomplete="off">
          <label class="field">
            <span>项目名称</span>
            <input id="project-name" name="name" type="text" maxlength="64" placeholder="例如：博客重构" required />
          </label>
          <button class="primary" type="submit">创建</button>
        </form>
      </section>

      <section aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">我的项目</h2>
          <button class="ghost" id="refresh" type="button">刷新</button>
        </div>
        <div id="projects" class="projects" aria-live="polite"></div>
        <p class="empty" id="empty" hidden>还没有项目，先创建一个吧。项目之间不共享会话、附件或上下文。</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
